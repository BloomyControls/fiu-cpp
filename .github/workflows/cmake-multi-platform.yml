name: CMake Build

on:
  push:
    paths:
      - '**.h'
      - '**.cpp'
      - '**.c'
      - '**.hpp'
      - '**.cmake'
      - '**/CMakeLists.txt'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-26.04, windows-latest]
        c_compiler: [gcc, clang, cl]
        lib_type: [static, shared]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-26.04
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-26.04
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-26.04
            c_compiler: cl

    steps:
    - uses: actions/checkout@v7

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
        echo "build-shared=${{ matrix.lib_type == 'static' && 'OFF' || 'ON' }}" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_SHARED_LIBS=${{ steps.strings.outputs.build-shared }}
        -S ${{ github.workspace }}

    - name: Build
      run: |
        echo "::add-matcher::.github/problem-matchers/${{ matrix.c_compiler }}.json"
        cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release
